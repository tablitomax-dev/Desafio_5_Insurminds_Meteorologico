# CI — gate obrigatório de qualidade (intent 001-repository-quality-foundation).
#
# Substitui o bootstrap Node (--if-present) por checks Python MANDATÓRIOS,
# conforme a nota de honestidade de gate do workflow anterior:
#   Lint:       ruff check .   (gate canônico do repo: E4,E7,E9,F,I,B — ruff.toml)
#   Type-check: mypy app       (contrato de tipos do produto)
#   Unit tests: pytest         (pytest.ini: testpaths = tests, suíte offline)
#
# Dependências fixadas em requirements-dev.txt (reprodutibilidade).
# Runtime do produto é stdlib-only: não há dependências de execução.
#
# Design do step de pré-merge associado (Fase 1 read_only_assess):
#   tools/ai-dlc/spec_pre_merge_quality_repair.md

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies (reproduzível)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy app/)
        run: mypy app

      - name: Unit tests (pytest)
        run: pytest